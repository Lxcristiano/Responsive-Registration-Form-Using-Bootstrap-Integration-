<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Responsive Registration Form</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body.light-mode {
            background-color: #f7f7f7;
            color: #000;
        }

        body.dark-mode {
            background-color: #1a1a1a;
            color: white;
        }

        .form-container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        body.dark-mode .form-container {
            background-color: #2b2b2b;
        }
    </style>
</head>

<body class="light-mode">

    <div class="container">
            <div class="d-flex justify-content-end mt-3">
            <button id="themeToggle" class="btn btn-dark">Dark Mode</button>
        </div>

    
        <div class="form-container">
            <h2 class="text-center mb-4">Registration Form</h2>

            <form id="regForm" class="needs-validation" novalidate>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">Enter first name</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">Enter last name</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required>
                    <div class="invalid-feedback">Enter valid email</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" minlength="6" required>
                    <div class="invalid-feedback">Minimum 6 characters</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" required>
                        <option disabled selected>Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                    <div class="invalid-feedback">Choose gender</div>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="agree" required>
                    <label class="form-check-label" for="agree">I agree to the Terms & Conditions</label>
                    <div class="invalid-feedback">You must agree</div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
        </div>
    </div>

    
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registration Successful 🎉</h5>
                </div>
                <div class="modal-body">
                    Your registration has been successfully submitted!
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        
        const themeBtn = document.getElementById("themeToggle");
        themeBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
            document.body.classList.toggle("light-mode");
            themeBtn.textContent = document.body.classList.contains("dark-mode") ? "Light Mode" : "Dark Mode";
            themeBtn.classList.toggle("btn-light");
            themeBtn.classList.toggle("btn-dark");
        });

        
        const form = document.getElementById("regForm");
        form.addEventListener("submit", function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            } else {
                event.preventDefault();
                const modal = new bootstrap.Modal(document.getElementById("successModal"));
                modal.show();
                form.reset();
            }
            form.classList.add("was-validated");
        });
    </script>

</body>
</html>
